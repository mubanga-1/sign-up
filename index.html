<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up</title>
</head>
<body>
    <!-- Side image -->
    <div class="logo-img">
        <img src="halie-west-25xggax4bSA-unsplash.jpg" alt="logo img">
    </div>

    <div class="form-wrapper">
        <form action="#" method="post">
            <!-- Header section -->
            <div class="head">
                <p>
                    This is not a real online service! You know you need something <br>
                    like this in your life to help you realize your deepest dreams. <br>
                    Sign up <span class="italic">now</span> to get started
                </p>
                <br>
                <span>You <span class="italic">know</span> you want to!</span>
            </div>

            <!-- Main content -->
            <div class="form">
                <h3 id="form-heading">Let's do this!</h3>
                <div class="form-info">
                    <div class="input-col1">
                        <div class="input-wrapper">
                            <label for="first-name">first name</label>
                                <input id="first-name" type="text" name="first-name">
                        </div>
                        <div class="input-wrapper">
                            <label for="email">email</label>
                                <input id="email" type="email" name="email">
                        </div>
                        <div class="input-wrapper">
                            <label for="password">password</label>
                                <input id="password" type="password" name="password">
                        </div>
                    </div>
                    <div class="input-col2">
                        <div class="input-wrapper">
                            <label for="last-name">last name</label>
                                <input id="last-name" type="text" name="last-name">
                        </div>
                        <div class="input-wrapper">
                            <label for="phone-number">phone number</label>
                                <input id="phone-number" type="tel" name="phone-number">                        
                        </div>
                        <div class="input-wrapper">
                            <label for="confirmation">comfirm password</label>
                                <input id="confirmation" type="password" name="confirmation">
                        </div>
                    </div>
                </div>
            </div>
            <div class="submit">
                <button type="submit">create account</button>
                <p>Already have an account? <span class="login-text">Log In</span></p>
            </div>
        </form>
    </div>
</body> 
</html>
